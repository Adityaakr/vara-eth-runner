name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  orderbook-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: orderbook }
      - run: cd orderbook && cargo test -p orderbook-app
  lab-server-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd lab-server && npm ci && npx tsc --noEmit && npx vitest run test/timeline.test.ts test/committed.test.ts
  lab-ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd lab-ui && npm ci && npm run build
